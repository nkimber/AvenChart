# Runs avenchart-ui as its own Docker Desktop stack.
#
# This deliberately does NOT define postgres/api services — those already
# exist in avenchart/docker-compose.yml and must be left untouched.
# Start that stack first (from avenchart/: `docker compose up -d`),
# then start this one. It talks to the existing API purely over HTTP via its
# published host port (5001), exactly like avenchart/frontend does.
services:
  avenchart-ui:
    image: avenchart-ui:local
    build:
      context: .
    environment:
      CHOKIDAR_USEPOLLING: "true"
      VITE_API_BASE_URL: http://localhost:5001
    ports:
      - "3100:3100"
    volumes:
      - .:/app
      - avenchart-ui-node-modules:/app/node_modules

volumes:
  avenchart-ui-node-modules:
