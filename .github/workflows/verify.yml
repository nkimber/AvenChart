name: Verify public source

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          dotnet-version: 10.0.x
      - name: Restore
        run: dotnet restore avenchart/AvenChart.slnx
      - name: Build
        run: dotnet build avenchart/AvenChart.slnx --configuration Release --no-restore
      - name: Test
        run: dotnet test avenchart/AvenChart.slnx --configuration Release --no-build --no-restore
      - name: Verify C# formatting
        run: dotnet format avenchart/AvenChart.slnx --verify-no-changes --no-restore

  frontends:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            avenchart/frontend/package-lock.json
            avenchart-ui/package-lock.json
      - name: Install and build reference frontend
        working-directory: avenchart/frontend
        run: |
          npm ci
          npm run lint
          npm run build
      - name: Install AvenChart UI
        working-directory: avenchart-ui
        run: npm ci
      - name: Test AvenChart UI
        working-directory: avenchart-ui
        run: npm test
      - name: Lint AvenChart UI
        working-directory: avenchart-ui
        run: npm run lint
      - name: Build AvenChart UI
        working-directory: avenchart-ui
        run: npm run build

  public-history:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
      - name: Regenerate public history
        run: node tools/generate-history-data.mjs
      - name: Verify generated history is current
        run: git diff --exit-code -- public-history/history-data.js
