x-api-build: &api-build
  context: .
  dockerfile: backend/src/AvenChart.Api/Dockerfile

x-api-database-environment: &api-database-environment
  ConnectionStrings__AvenChart: Host=postgres;Port=5432;Database=${AVENCHART_DATABASE_NAME:-avenchart};Username=avenchart;Password=avenchart_demo
  DatabaseSchema__MigrationsPath: /app/database/migrations

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${AVENCHART_DATABASE_NAME:-avenchart}
      POSTGRES_USER: avenchart
      POSTGRES_PASSWORD: avenchart_demo
    ports:
      - "5433:5432"
    volumes:
      - avenchart-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U avenchart -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20

  migrator:
    image: avenchart-api:local
    command: ["--migrate-only"]
    environment: *api-database-environment
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  api:
    image: avenchart-api:local
    build: *api-build
    environment:
      <<: *api-database-environment
      ASPNETCORE_URLS: http://+:8080
      RuntimeSafety__RateLimitPermitLimit: 5000
    ports:
      - "5001:8080"
    depends_on:
      migrator:
        condition: service_completed_successfully
        restart: true
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://localhost:8080/health/ready"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

  frontend:
    build:
      context: ./frontend
    environment:
      VITE_API_BASE_URL: http://localhost:5001
    ports:
      - "3000:3000"
    depends_on:
      api:
        condition: service_healthy
        restart: true

volumes:
  avenchart-postgres:
