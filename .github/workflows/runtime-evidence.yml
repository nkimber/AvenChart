name: Runtime evidence

on:
  schedule:
    - cron: "30 5 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  synthetic-runtime-evidence:
    name: Seeded API and modern UI evidence
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          dotnet-version: 10.0.x
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: avenchart-ui/package-lock.json
      - name: Install modern UI dependencies
        working-directory: avenchart-ui
        run: npm ci
      - name: Install browsers for telehealth evidence
        working-directory: avenchart-ui
        run: npx playwright install --with-deps chromium firefox webkit
      - name: Start seeded AvenChart runtime
        working-directory: avenchart
        shell: pwsh
        run: |
          docker compose up -d --build --wait api
          ./scripts/Seed-AvenChartGoldDataset.ps1 -SkipMigrationImageBuild
      - name: Run migration resilience evidence
        working-directory: avenchart
        shell: pwsh
        run: ./scripts/Test-AvenChartMigrationResilience.ps1
      - name: Run governed API workflow baseline
        working-directory: avenchart
        shell: pwsh
        run: ./scripts/Test-AvenChartBaseline.ps1
      - name: Run external laboratory FHIR intake evidence
        working-directory: avenchart
        shell: pwsh
        run: ./scripts/Test-ExternalLaboratoryFhirIntake.ps1
      - name: Run development OIDC provider evidence
        working-directory: avenchart
        shell: pwsh
        run: |
          $env:IdentityProvider__Mode = "test-oidc"
          docker compose up -d --force-recreate --wait api
          ./scripts/Test-DevelopmentTestOidc.ps1
          Remove-Item Env:\IdentityProvider__Mode
      - name: Restore local identity runtime for browser evidence
        working-directory: avenchart
        shell: pwsh
        run: |
          $env:IdentityProvider__Mode = "local"
          docker compose up -d --force-recreate --wait api
          Remove-Item Env:\IdentityProvider__Mode
          ./scripts/Seed-AvenChartGoldDataset.ps1 -SkipMigrationImageBuild
      - name: Rehearse database backup and restore
        working-directory: avenchart
        shell: pwsh
        run: ./scripts/Test-AvenChartBackupRestore.ps1
      - name: Verify restored runtime operational readiness
        working-directory: avenchart
        shell: pwsh
        run: ./scripts/Test-AvenChartOperationalReadiness.ps1
      - name: Capture persistence query-plan evidence
        working-directory: avenchart
        shell: pwsh
        run: ./scripts/Test-AvenChartPersistenceEvidence.ps1
      - name: Start disabled-by-default synthetic telehealth runtime
        working-directory: avenchart
        shell: pwsh
        run: |
          docker compose stop api
          docker compose run -d --name avenchart-telehealth-api --no-deps --service-ports -e Telehealth__Enabled=true -e RuntimeSafety__RateLimitPermitLimit=10000 api
          $deadline = (Get-Date).AddSeconds(90)
          do {
            try {
              $health = Invoke-RestMethod http://127.0.0.1:5001/health/ready -TimeoutSec 5
              if ($health.status -eq "healthy") { break }
            } catch { }
            Start-Sleep -Seconds 2
          } while ((Get-Date) -lt $deadline)
          if ($health.status -ne "healthy") { throw "Synthetic telehealth runtime did not become ready." }
      - name: Run telehealth migration and runtime-safety evidence
        working-directory: avenchart
        shell: pwsh
        run: |
          ./scripts/Test-TelehealthMigrationResilience.ps1 -SkipBaseRehearsal
          ./scripts/Test-TelehealthRuntimeSafety.ps1 -ApiBaseUrl http://127.0.0.1:5001
      - name: Run telehealth OpenAPI and authorization evidence
        working-directory: avenchart
        shell: pwsh
        run: |
          ./scripts/Test-TelehealthOpenApiContract.ps1
          ./scripts/Test-TelehealthAuthorization.ps1
          ./scripts/Test-TelehealthProspectiveIdentity.ps1
          ./scripts/Test-TelehealthApplicantIdentityReview.ps1
          ./scripts/Test-TelehealthProspectiveSafetyTriage.ps1
          ./scripts/Test-TelehealthProspectiveVisitPurpose.ps1
          ./scripts/Test-TelehealthProspectivePracticeNetworkPrecheck.ps1
          ./scripts/Test-TelehealthProspectiveMemberInsuranceDetails.ps1
          ./scripts/Test-TelehealthProspectiveEligibility.ps1
          ./scripts/Test-TelehealthProspectivePracticeNetworkDetermination.ps1
          ./scripts/Test-TelehealthProspectiveIdentityProofing.ps1
          ./scripts/Test-TelehealthApplicantPromotionAuthorization.ps1
          ./scripts/Test-TelehealthApplicantRegistrationDetailsConfirmation.ps1
          ./scripts/Test-TelehealthApplicantInsuranceHandoffConfirmation.ps1
          ./scripts/Test-TelehealthApplicantCommunicationAccessReadiness.ps1
          ./scripts/Test-TelehealthApplicantDevicePreparation.ps1
          ./scripts/Test-TelehealthApplicantClinicalInformationInventory.ps1
          ./scripts/Test-TelehealthApplicantMedicationInformation.ps1
          ./scripts/Test-TelehealthApplicantAllergyInformation.ps1
          ./scripts/Test-TelehealthApplicantHealthHistoryInformation.ps1
          ./scripts/Test-TelehealthApplicantClinicalInformationSummary.ps1
          ./scripts/Test-TelehealthApplicantPreRequestReadiness.ps1
          ./scripts/Test-TelehealthApplicantPracticeReviewSubmission.ps1
          ./scripts/Test-TelehealthApplicantPracticeReviewInbox.ps1
          ./scripts/Test-TelehealthApplicantPracticeReviewAuthorization.ps1
          ./scripts/Test-TelehealthApplicantRequestComplaintTriage.ps1
          ./scripts/Test-TelehealthApplicantRequestIntake.ps1
          ./scripts/Test-TelehealthApplicantRequestInsuranceSource.ps1
          ./scripts/Test-TelehealthApplicantRequestEligibility.ps1
      - name: Run telehealth real PostgreSQL queue-concurrency evidence
        working-directory: avenchart
        shell: pwsh
        run: ./scripts/Test-TelehealthQueueConcurrency.ps1 -CallerCount 20
      - name: Run telehealth browser accessibility and recovery evidence
        working-directory: avenchart-ui
        run: |
          set +e
          npx playwright test e2e/telehealth-accessibility.spec.ts e2e/telehealth-failure-recovery.spec.ts --workers=1
          telehealth_exit_code=$?
          if [ -d test-results ]; then mv test-results telehealth-test-results; fi
          if [ -d playwright-report ]; then mv playwright-report telehealth-playwright-report; fi
          exit "$telehealth_exit_code"
      - name: Run modern UI browser evidence in Chromium
        working-directory: avenchart-ui
        run: |
          set +e
          npx playwright test e2e/route-smoke.spec.ts --project=desktop-chromium --project=mobile-chromium --workers=1
          route_smoke_exit_code=$?
          mv test-results route-smoke-test-results
          mv playwright-report route-smoke-playwright-report

          npx playwright test e2e/accessibility.spec.ts --project=desktop-chromium --project=mobile-chromium --workers=1
          accessibility_exit_code=$?
          mv test-results accessibility-test-results
          mv playwright-report accessibility-playwright-report

          if [ "$route_smoke_exit_code" -ne 0 ] || [ "$accessibility_exit_code" -ne 0 ]; then
            exit 1
          fi
      - name: Upload API evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: avenchart-runtime-artifacts
          path: avenchart/artifacts/
          if-no-files-found: ignore
      - name: Upload browser evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: avenchart-browser-evidence
          path: |
            avenchart-ui/route-smoke-playwright-report/
            avenchart-ui/route-smoke-test-results/
            avenchart-ui/accessibility-playwright-report/
            avenchart-ui/accessibility-test-results/
            avenchart-ui/telehealth-playwright-report/
            avenchart-ui/telehealth-test-results/
          if-no-files-found: ignore
      - name: Collect Docker logs
        if: always()
        working-directory: avenchart
        run: docker compose logs --no-color > runtime-docker-compose.log
      - name: Upload Docker logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: avenchart-runtime-docker-logs
          path: avenchart/runtime-docker-compose.log
          if-no-files-found: ignore
      - name: Stop runtime
        if: always()
        working-directory: avenchart
        run: docker compose down --volumes --remove-orphans
