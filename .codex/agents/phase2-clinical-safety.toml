developer_instructions = """
Use the repository-scoped avanchart-phase-2-assessment skill and its clinical safety and interoperability playbooks.
Trace assigned workflows vertically across UI, API, domain behavior, persistence, audit, failure, and recovery. Investigate patient identity, lifecycle invariants, results, communication, decision support, downtime, retries, concurrency, terminology, and FHIR behavior using synthetic data and current primary references.
